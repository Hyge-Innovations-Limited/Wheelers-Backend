<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="chat.css">
<title>Trip chat · Wheelers</title>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="mark" viewBox="0 0 83 83" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wheelers"><rect width="82.1161" height="82.1161" rx="12.3174" fill="#FF7700"/><path d="M48.1453 10.712C55.4632 10.6823 63.0012 10.6475 70.3102 10.7158C70.3425 14.5644 69.819 20.9519 69.414 24.7845C68.29 35.4206 65.0334 61.6465 57.1527 69.1636C55.9543 70.3069 54.1021 71.529 52.1862 71.6441C51.0682 71.712 50.0534 71.3748 49.2163 70.788C44.8701 67.7427 43.7239 58.0597 43.3432 53.5894C43.0982 54.878 42.9843 56.1865 42.7604 57.4792C42.1116 61.2236 40.8286 66.7673 37.8116 69.6735C36.9608 70.4926 35.8496 71.1383 34.4932 71.2219C32.8028 71.3254 31.1915 70.5331 29.9485 69.6818C28.2278 68.5035 26.8756 67.0395 25.7523 65.4678C17.4396 53.8334 13.1833 24.2477 11.8042 10.5071C19.7275 10.4106 28.0154 10.5036 35.9579 10.5048L33.8437 51.2213L33.2895 61.1681C33.2117 62.5438 33.054 64.11 33.0973 65.4808C33.106 65.755 33.2493 65.9071 33.4972 66.0607C33.8241 66.0757 34.0237 65.9873 34.122 65.718C36.0987 60.2969 37.1336 54.2556 38.0324 48.6728C39.2915 40.4598 40.289 32.2215 41.0236 23.9666C41.2161 22.0475 41.3849 20.1269 41.5299 18.205C41.6071 17.2019 41.5805 13.8985 42.4905 13.3078C43.2328 13.1019 43.6119 13.637 43.7041 14.1503C43.9854 15.7175 44.1943 17.2963 44.422 18.8695L45.6615 27.4075L49.5476 54.5675C49.6724 55.4544 50.3389 61.4347 50.6468 61.7905C50.776 61.9399 50.899 61.9947 51.1158 62.0317C51.1967 62.0091 51.3164 61.992 51.3729 61.9406C51.9271 61.4313 51.6494 57.8692 51.6354 57.0905C51.3506 46.4589 50.6426 35.8376 49.5124 25.243C49.3139 23.8255 49.195 22.2791 49.0402 20.8488L48.1453 10.712Z" fill="#FEFAEF"/></svg>
    <div class="who">
      <span class="who-name" id="who-name">Your driver</span>
      <span class="who-meta" id="who-meta"></span>
    </div>
    <button class="call-btn" id="call-btn" type="button" aria-label="Call" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      <span>Call</span>
    </button>
  </header>

  <section data-view="loading" class="center">
    <p class="muted">Opening your chat…</p>
  </section>

  <section data-view="fatal" class="center" hidden>
    <div class="card note"><h1>Link problem</h1><p id="fatal-message"></p></div>
    <p class="foot">Go back to WhatsApp and tap <b>Chat or call driver</b> on your ride message for a fresh link.</p>
  </section>

  <section data-view="chat" class="chat" hidden>
    <div class="banner" id="banner" hidden></div>
    <ol class="thread" id="thread" aria-live="polite"></ol>
    <p class="empty" id="empty" hidden>Say hello. Messages here stay between you and your driver, and Wheelers keeps a copy for your safety.</p>
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Message" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
  </section>
</div>

<!-- the call, over everything -->
<div class="call" id="call" hidden>
  <div class="call-body">
    <div class="avatar" id="call-avatar">D</div>
    <p class="call-name" id="call-name">Your driver</p>
    <p class="call-status" id="call-status">Calling…</p>
  </div>
  <div class="call-actions" id="actions-incoming" hidden>
    <button class="round decline" id="decline" type="button" aria-label="Decline">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.1.3-4.5.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3L.3 13.1a1 1 0 0 1 0-1.4C3.4 8.8 7.5 7 12 7s8.6 1.8 11.7 4.7a1 1 0 0 1 0 1.4l-2.5 2.4c-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
      <span>Decline</span>
    </button>
    <button class="round answer" id="answer" type="button" aria-label="Answer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      <span>Answer</span>
    </button>
  </div>
  <div class="call-actions" id="actions-live" hidden>
    <button class="round quiet" id="mute" type="button" aria-label="Mute" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2z"/></svg>
      <span id="mute-label">Mute</span>
    </button>
    <button class="round decline" id="hangup" type="button" aria-label="End call">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.1.3-4.5.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3L.3 13.1a1 1 0 0 1 0-1.4C3.4 8.8 7.5 7 12 7s8.6 1.8 11.7 4.7a1 1 0 0 1 0 1.4l-2.5 2.4c-.2.2-.4.3-.7.3-.3 0-.5-.1-.7-.3-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>
      <span>End</span>
    </button>
  </div>
  <audio id="remote-audio" autoplay playsinline></audio>
</div>

<div id="toast" hidden></div>
<script src="../wallet/common.js"></script>
<script src="chat.js"></script>
</body>
</html>
